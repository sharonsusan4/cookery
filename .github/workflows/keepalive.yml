# Supabase pauses free projects after about a week without use. This asks the
# database for one recipe every 3 days so Mom's app never finds it asleep.
# Signed-out requests get no rows back (Row Level Security), but it still
# counts as the database being used.
#
# It reads the project address and the public (anon) key from app/config.js,
# the same values the app uses, so no repository secrets are needed. If
# SUPABASE_URL and SUPABASE_ANON_KEY secrets are set, those are used instead.
name: Keep Supabase awake

on:
  schedule:
    - cron: '23 4 */3 * *' # every 3 days, 09:53 in India
  workflow_dispatch: # "Run workflow" button, to try it

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/config.js
          sparse-checkout-cone-mode: false
      - name: Ask the database for one recipe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          [ -n "$SUPABASE_URL" ] || SUPABASE_URL=$(sed -n "s/^const SUPABASE_URL = '\(.*\)';.*/\1/p" app/config.js)
          [ -n "$SUPABASE_ANON_KEY" ] || SUPABASE_ANON_KEY=$(sed -n "s/^const SUPABASE_ANON_KEY = '\(.*\)';.*/\1/p" app/config.js)
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Couldn't find the Supabase address and key in app/config.js." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 --retry 3 --retry-all-errors \
            "${SUPABASE_URL%/}/rest/v1/recipes?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
          echo
          echo "Supabase answered."
