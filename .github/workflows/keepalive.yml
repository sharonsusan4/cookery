# Supabase pauses free projects after about a week without use. This asks the
# database for one recipe every 3 days so Mom's app never finds it asleep.
# Signed-out requests get no rows back (Row Level Security), but it still
# counts as the database being used.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
# SUPABASE_URL and SUPABASE_ANON_KEY, the same values as in app/config.js.
name: Keep Supabase awake

on:
  schedule:
    - cron: '23 4 */3 * *' # every 3 days, 09:53 in India
  workflow_dispatch: # "Run workflow" button, to try it

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for one recipe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets first." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 --retry 3 --retry-all-errors \
            "${SUPABASE_URL%/}/rest/v1/recipes?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
          echo
          echo "Supabase answered."
