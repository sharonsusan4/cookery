<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipes</title>
  <!-- One theme, banana-leaf green, whatever the phone's light/dark setting. -->
  <meta name="theme-color" content="#fdf8f4">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Gloock for the big words and dish names, Atkinson Hyperlegible Next for
       everything else: made for low vision. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..700&family=Gloock&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The bottom bar. app.js draws each tab's line icon (data-icon, from icons.js)
       and moves the short mark along the top to the tab she's on. -->
  <nav class="tabs" aria-label="Main">
    <div class="tabs-inner">
      <span class="tab-mark" aria-hidden="true"></span>
      <a href="#today" data-tab="today"><span class="tab-icon" data-icon="chef-hat" aria-hidden="true"></span>Today</a>
      <a href="#recipes" data-tab="recipes"><span class="tab-icon" data-icon="book-2" aria-hidden="true"></span>Recipes</a>
      <a href="#plan" data-tab="plan"><span class="tab-icon" data-icon="calendar" aria-hidden="true"></span>Plan</a>
      <a href="#cooked" data-tab="cooked"><span class="tab-icon" data-icon="camera" aria-hidden="true"></span>Cooked</a>
      <a href="#add" data-tab="add"><span class="tab-icon" data-icon="circle-plus" aria-hidden="true"></span>Add</a>
      <a href="#list" data-tab="list"><span class="tab-icon" data-icon="list-check" aria-hidden="true"><span class="count" hidden></span></span>List</a>
    </div>
  </nav>

  <main id="view" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Talks to the database. Pinned to one version (with its checksum) so it
       never changes underneath her; sw.js keeps a copy for opening offline. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="links.js"></script>
  <script src="icons.js"></script>
  <script src="welcome.js"></script>
  <script src="app.js"></script>
</body>
</html>
